name: Release

# Push a version tag (git tag v0.1.0 && git push origin v0.1.0) to build a universal macOS
# .dmg and publish it as a GitHub Release. Bump "version" in src-tauri/tauri.conf.json first.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      # Signing and notarization switch on by themselves once these repo secrets exist
      # (see README → Signing). Without them the build is unsigned.
      HAS_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Load signing secrets
        if: env.HAS_SIGNING == 'true'
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"

      # The release notes say whether this build is signed, and if not, how to open it.
      - name: Write release notes
        run: |
          if [ "$HAS_SIGNING" = true ]; then
            NOTES='Download the .dmg below, open it, and drag Virgil to Applications.

          This build is signed with an Apple Developer ID and notarized by Apple, so it opens like any other app.'
          else
            NOTES='Download the .dmg below, open it, and drag Virgil to Applications.

          This build is not signed by Apple. The first time, right-click Virgil in Applications and choose **Open**, then **Open** again. On macOS 15 and later, if there is no Open button, open Virgil once, then click **Open Anyway** in System Settings → Privacy & Security. After that it opens normally.'
          fi
          { echo "RELEASE_NOTES<<EOF"; echo "$NOTES"; echo "EOF"; } >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: Virgil ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_NOTES }}
          releaseDraft: false
          prerelease: false

      # tauri-action notarizes the app but not the .dmg around it. Notarize and staple the .dmg
      # too, so a downloaded copy passes Gatekeeper offline, and replace the release's copy.
      - name: Notarize the .dmg
        if: env.HAS_SIGNING == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_PASSWORD" --wait
          xcrun stapler staple "$dmg"
          spctl -a -vvv -t open --context context:primary-signature "$dmg"
          gh release upload "${{ github.ref_name }}" "$dmg" --clobber
