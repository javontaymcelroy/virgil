[package]
name = "virgil"
version = "0.1.0"
description = "An RSVP speed reader for macOS"
authors = ["Javontay McElroy"]
license = "MIT"
repository = "https://github.com/javontaymcelroy/virgil"
edition = "2021"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdf-extract = "0.12"
epub = "2"
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
